<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palabras rechazadas</title>
  <style>
    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #222;
    }
    h1 { margin-top: 0; }
    #resumen { color: #555; }
    #lista {
      columns: 3 180px;
      padding-left: 24px;
      line-height: 1.7;
    }
    #vacio {
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>📖 Palabras rechazadas</h1>
  <p id="resumen">Cargando lista...</p>
  <p id="vacio" hidden>No hay palabras rechazadas registradas.</p>
  <ol id="lista"></ol>

  <script src="../js/rechazadas.js"></script>
</body>
</html>
