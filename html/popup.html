<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 250px; padding: 15px; font-family: system-ui, sans-serif; }
    button { 
      width: 100%; padding: 10px; font-weight: bold; 
      background-color: #0078D7; color: white; 
      border: none; border-radius: 5px; cursor: pointer;
    }
    button:hover { background-color: #005A9E; }
    #estado { margin-top: 15px; font-size: 14px; color: #555; }
    fieldset { margin: 12px 0; padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; }
    legend { font-size: 13px; font-weight: bold; padding: 0 4px; }
    .rango { display: flex; gap: 8px; }
    .rango label { flex: 1; font-size: 13px; }
    .rango input { width: 100%; box-sizing: border-box; padding: 4px; }
    #ayuda-demora { margin-top: 6px; font-size: 12px; color: #666; }
    #btn-informe { margin-top: 8px; background-color: #555; }
    #btn-informe:hover { background-color: #333; }
  </style>
</head>
<body>
  <h4>🤖 Bot BombParty</h4>

  <div>
    <label><input type="radio" name="modo-bot" value="completa" checked> Completa</label><br>
    <label><input type="radio" name="modo-bot" value="auto"> Auto</label><br>
    <label><input type="radio" name="modo-bot" value="manual"> Manual</label>
  </div>

  <fieldset>
    <legend>⏱️ Demora antes de enviar (seg)</legend>
    <div class="rango">
      <label>Mín <input id="delay-min" type="number" min="0" max="10" step="0.1" value="0.5"></label>
      <label>Máx <input id="delay-max" type="number" min="0" max="10" step="0.1" value="3.5"></label>
    </div>
    <div id="ayuda-demora">Envía entre 0.5 y 3.5 s al azar</div>
  </fieldset>

  <button id="btn-jugar">¡Jugar!</button>
  <button id="btn-informe">📊 Ver último informe</button>
  <div id="estado">Esperando orden...</div>
  
  <script src="../js/popup.js"></script>
</body>
</html>
